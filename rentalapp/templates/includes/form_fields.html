{% for field in form %}
  <div class="form-field {% if field.name == 'description' or field.name == 'notes' or field.name == 'address' %}span-2{% endif %}">
    <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}{% if field.field.required %}<span class="required">*</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
    {% for error in field.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}
  </div>
{% endfor %}
{% for error in form.non_field_errors %}<div class="alert alert-danger span-2">{{ error }}</div>{% endfor %}
