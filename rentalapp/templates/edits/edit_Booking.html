{% extends 'index.html' %}

{% load crispy_forms_tags %}

{% block content %}

<h2>Edit Payment</h2>

<form method="POST">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit">Update Payment</button>
    <a href="{% url 'add_Booking_page' %}">Cancel</a>
</form>

{% endblock content %}
