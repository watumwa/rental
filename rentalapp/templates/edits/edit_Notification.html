{% extends 'index.html' %}
{% load crispy_forms_tags %}

{% block content %}
<h2>Edit Notification</h2>

<form method="POST">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit">Update Notification</button>
    <a href="{% url 'add_Notification_page' %}">Cancel</a>
</form>
{% endblock content %}
