<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rental Management System - Login</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#2c3e50,#3498db);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-container{
            width:380px;
            background:#fff;
            padding:35px;
            border-radius:12px;
            box-shadow:0 8px 20px rgba(0,0,0,0.2);
        }

        .login-container h2{
            text-align:center;
            color:#2c3e50;
            margin-bottom:10px;
        }

        .login-container p{
            text-align:center;
            color:#777;
            margin-bottom:25px;
            font-size:14px;
        }

        .form-group{
            margin-bottom:18px;
        }

        label{
            display:block;
            margin-bottom:6px;
            font-weight:bold;
            color:#333;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:15px;
        }

        input:focus{
            border-color:#3498db;
            outline:none;
        }

        .remember{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
            font-size:14px;
        }

        .remember a{
            text-decoration:none;
            color:#3498db;
        }

        button{
            width:100%;
            padding:12px;
            background:#3498db;
            color:#fff;
            border:none;
            border-radius:6px;
            font-size:16px;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#2980b9;
        }

        .footer{
            text-align:center;
            margin-top:20px;
            font-size:14px;
        }

        .footer a{
            text-decoration:none;
            color:#3498db;
            font-weight:bold;
        }
    </style>
</head>
<body>

<div class="login-container">

    <h2>Rental Management System</h2>
    <p>Login to your account</p>

    <form action="" method="POST">

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" required>
        </div>

        <div class="remember">
            <label>
                <input type="checkbox">
                Remember Me
            </label>

            <a href="#">Forgot Password?</a>
        </div>

        <button type="submit">Login</button>

        <div class="footer">
            Don't have an account?
            <a href="#">Register</a>
        </div>

    </form>

</div>

</body>
</html>
