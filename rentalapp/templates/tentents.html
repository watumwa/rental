<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Tenant | Rental Management System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
}

.container{
    width:60%;
    margin:40px auto;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    color:#2c3e50;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input, select, textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

textarea{
    resize:vertical;
}

.row{
    display:flex;
    gap:20px;
}

.col{
    flex:1;
}

button{
    width:100%;
    padding:14px;
    background:#007bff;
    color:#fff;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

@media(max-width:768px){
    .container{
        width:95%;
    }

    .row{
        flex-direction:column;
    }
}
</style>

</head>
<body>

<div class="container">

<h2>Tenant Booking Form</h2>

<form method="POST">

<div class="row">

<div class="col">
<div class="form-group">
<label>First Name</label>
<input type="text" name="first_name" required>
</div>
</div>

<div class="col">
<div class="form-group">
<label>Last Name</label>
<input type="text" name="last_name" required>
</div>
</div>

</div>

<div class="form-group">
<label>National ID / Passport</label>
<input type="text" name="national_id" required>
</div>

<div class="row">

<div class="col">
<div class="form-group">
<label>Phone Number</label>
<input type="tel" name="phone" required>
</div>
</div>

<div class="col">
<div class="form-group">
<label>Email Address</label>
<input type="email" name="email">
</div>
</div>

</div>

<div class="row">

<div class="col">
<div class="form-group">
<label>Select Property</label>
<select name="property" required>
<option value="">Choose Property</option>
<option>Apartment A</option>
<option>Apartment B</option>
<option>House 1</option>
<option>House 2</option>
<option>Shop 1</option>
</select>
</div>
</div>

<div class="col">
<div class="form-group">
<label>Room/Unit Number</label>
<input type="text" name="unit_number" required>
</div>
</div>

</div>

<div class="row">

<div class="col">
<div class="form-group">
<label>Move-in Date</label>
<input type="date" name="move_in" required>
</div>
</div>

<div class="col">
<div class="form-group">
<label>Lease Duration</label>
<select name="lease_duration">
<option>6 Months</option>
<option>12 Months</option>
<option>24 Months</option>
</select>
</div>
</div>

</div>

<div class="row">

<div class="col">
<div class="form-group">
<label>Monthly Rent (UGX)</label>
<input type="number" name="rent" required>
</div>
</div>

<div class="col">
<div class="form-group">
<label>Security Deposit (UGX)</label>
<input type="number" name="deposit" required>
</div>
</div>

</div>

<div class="form-group">
<label>Additional Notes</label>
<textarea rows="4" name="notes"></textarea>
</div>

<button type="submit">
Book Tenant
</button>

</form>

</div>

</body>
</html>
