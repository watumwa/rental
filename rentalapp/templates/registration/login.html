{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · RentPro</title><link rel="stylesheet" href="{% static 'assets/css/style.css' %}"><link rel="stylesheet" href="{% static 'assets/css/rentpro.css' %}"></head><body><main style="min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#0f2c25,#245b49)"><section class="detail-card" style="width:min(410px,100%);padding:28px"><div class="d-flex align-items-center gap-3 mb-4"><span class="brand-mark">R</span><div><h1 style="font-size:20px;margin:0;font-weight:750">Welcome to RentPro</h1><p class="text-muted mb-0" style="font-size:11px">Property operations &amp; rental management</p></div></div>{% if form.errors %}<div class="alert alert-danger">Your username or password was not recognised.</div>{% endif %}<form method="post">{% csrf_token %}<div class="mb-3"><label class="form-label" for="id_username">Username</label><input class="form-control" id="id_username" name="username" autofocus required></div><div class="mb-4"><label class="form-label" for="id_password">Password</label><input class="form-control" id="id_password" name="password" type="password" required></div><button class="btn btn-primary w-100" type="submit">Sign in</button><input type="hidden" name="next" value="{{ next }}"></form></section></main></body></html>
